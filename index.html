<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NET PRO VPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(17, 24, 39, 0.75);
      --text: #ffffff;
      --hint: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #111827 0%, var(--bg) 100%);
      color: var(--text);
      margin: 0;
      padding: 16px;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      text-align: center;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #60a5fa 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: 0.84rem;
      color: var(--hint);
    }

    .page {
      display: none;
      animation: fadeIn 0.22s ease-out;
      width: 100%;
    }
    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* استایل دکمه‌های با پس‌زمینه رنگی واقعی */
    .color-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 14px;
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.15s ease;
    }
    .color-btn:active {
      transform: scale(0.97);
    }

    /* رنگ‌های منوی اصلی */
    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.42);
      border: 1px solid rgba(16, 185, 129, 0.6);
    }

    .btn-lightblue {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.42);
      border: 1px solid rgba(56, 189, 248, 0.6);
    }

    .btn-orange {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.42);
      border: 1px solid rgba(245, 158, 11, 0.6);
    }

    .btn-lightred {
      background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      box-shadow: 0 4px 18px rgba(248, 113, 113, 0.42);
      border: 1px solid rgba(248, 113, 113, 0.6);
    }

    /* رنگ‌بندی پلن‌ها */
    .plan-blue {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      border: 1px solid rgba(96, 165, 250, 0.4);
    }

    .plan-green {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .plan-orange {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
      border: 1px solid rgba(251, 146, 60, 0.4);
    }

    .plan-red {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
      border: 1px solid rgba(251, 113, 133, 0.4);
    }

    .price-pill {
      background: rgba(0, 0, 0, 0.28);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .nav-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- هدر برند نت پرو -->
  <div class="header-bar">
    <div class="brand-title">NET PRO VPN</div>
    <div class="brand-sub">سرویس‌های اختصاصی، سریع و پایدار</div>
  </div>

  <!-- صفحه اول: منوی اصلی ۴ رنگ -->
  <div id="page-home" class="page active">
    <!-- ۱. دکمه خرید اشتراک جدید (سبز) -->
    <button type="button" class="color-btn btn-green" onclick="showPlans('new')">
      <span>🛍 خرید اشتراک جدید</span>
      <span>←</span>
    </button>

    <!-- ۲. دکمه تمدید اشتراک (آبی کم‌رنگ) -->
    <button type="button" class="color-btn btn-lightblue" onclick="chooseAction('renew')">
      <span>🔄 تمدید اشتراک قبلی</span>
      <span>←</span>
    </button>

    <!-- ۳. دکمه شارژ کیف پول (نارنجی) -->
    <button type="button" class="color-btn btn-orange" onclick="chooseAction('wallet')">
      <span>💳 شارژ کیف پول</span>
      <span>💰</span>
    </button>

    <!-- ۴. دکمه حجم اضافه (قرمز ملایم) -->
    <button type="button" class="color-btn btn-lightred" onclick="chooseAction('extra')">
      <span>➕ خرید حجم اضافه</span>
      <span>⚡️</span>
    </button>
  </div>

  <!-- صفحه دوم: پلن‌های رنگ‌بندی‌شده -->
  <div id="page-plans" class="page">
    <div class="top-nav">
      <button type="button" class="nav-back" onclick="showHome()">← بازگشت</button>
      <span style="font-weight: 800; font-size: 0.95rem;">انتخاب تعرفه و پلن</span>
    </div>

    <!-- دو پلن اول: آبی -->
    <button type="button" class="color-btn plan-blue" onclick="selectPlan(0)">
      <span>یکماهه ۱۰ گیگابایت</span>
      <span class="price-pill">۱۳۷,۰۰۰ تومان</span>
    </button>
    <button type="button" class="color-btn plan-blue" onclick="selectPlan(1)">
      <span>یکماهه ۲۰ گیگابایت</span>
      <span class="price-pill">۲۶۴,۰۰۰ تومان</span>
    </button>

    <!-- دو پلن دوم: سبز -->
    <button type="button" class="color-btn plan-green" onclick="selectPlan(2)">
      <span>یکماهه ۳۰ گیگابایت</span>
      <span class="price-pill">۳۸۴,۰۰۰ تومان</span>
    </button>
    <button type="button" class="color-btn plan-green" onclick="selectPlan(3)">
      <span>یکماهه ۵۰ گیگابایت</span>
      <span class="price-pill">۵۵۴,۰۰۰ تومان</span>
    </button>

    <!-- دو پلن سوم: نارنجی -->
    <button type="button" class="color-btn plan-orange" onclick="selectPlan(4)">
      <span>یکماهه ۷۵ گیگابایت</span>
      <span class="price-pill">۸۱۴,۰۰۰ تومان</span>
    </button>
    <button type="button" class="color-btn plan-orange" onclick="selectPlan(5)">
      <span>یکماهه ۱۰۰ گیگابایت</span>
      <span class="price-pill">۱,۰۰۰,۰۰۰ تومان</span>
    </button>

    <!-- دو پلن چهارم: قرمز -->
    <button type="button" class="color-btn plan-red" onclick="selectPlan(6)">
      <span>یکماهه ۱۵۰ گیگابایت</span>
      <span class="price-pill">۱,۴۸۴,۰۰۰ تومان</span>
    </button>
    <button type="button" class="color-btn plan-red" onclick="selectPlan(7)">
      <span>یکماهه ۲۰۰ گیگابایت</span>
      <span class="price-pill">۱,۸۵۴,۰۰۰ تومان</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    function showHome() {
      document.getElementById('page-plans').classList.remove('active');
      document.getElementById('page-home').classList.add('active');
    }

    function showPlans() {
      document.getElementById('page-home').classList.remove('active');
      document.getElementById('page-plans').classList.add('active');
    }

    // انتخاب پلن و انتقال خودکار به ربات
    function selectPlan(planIndex) {
      if (tg && typeof tg.sendData === 'function') {
        tg.sendData("SELECT_PLAN_" + planIndex);
      } else {
        alert("پلن انتخاب شد. به ربات مراجعه کنید.");
      }
    }

    // هدایت به گزینه‌های دیگر
    function chooseAction(action) {
      if (tg && typeof tg.sendData === 'function') {
        tg.sendData("ACTION_" + action);
      } else {
        alert("گزینه انتخاب شد.");
      }
    }
  </script>
</body>
</html>
